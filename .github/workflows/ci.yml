name: ci

# The project's own checks: tests, lints, build. Its `gate` job is a required status
# check on `main` (init-repo.sh sets it), so nothing merges without passing it.
# Keep the job id `gate`: branch protection requires it by that name.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install --quiet -e '.[dev]'
      - name: Test
        run: python -m pytest

  # The oldest Python bashwalker supports. pdca-harness instances allow 3.11, so the suite
  # runs there too.
  python-3-11:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --quiet -e '.[dev]'
      - name: Test
        run: python -m pytest
