name: ci

# The project's own checks: tests, lints, build. Its `gate` job is a required status
# check on `main` (init-repo.sh sets it), so nothing merges without passing it.
# Keep the job id `gate`: branch protection requires it by that name.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install --quiet -e '.[dev]'
      - name: Test
        run: python -m pytest

  # The oldest Python bashwalker supports. pdca-harness instances allow 3.11, so the suite
  # runs there too.
  python-3-11:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --quiet -e '.[dev]'
      - name: Test
        run: python -m pytest

  # The differential parser test (#7): the walker against `bash -n`, shfmt and bash's own
  # reprint (sandboxed with bubblewrap), on each bash release scripts/build_bash.py builds.
  differential:
    name: differential (bash ${{ matrix.bash }})
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash: ["5.1", "5.2", "5.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ~/bash-${{ matrix.bash }}
          key: bash-${{ matrix.bash }}-${{ runner.os }}-${{ hashFiles('scripts/build_bash.py') }}
      - name: Build bash ${{ matrix.bash }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -I scripts/build_bash.py "${{ matrix.bash }}" ~/bash-${{ matrix.bash }}
      - name: Install the oracles
        env:
          SHFMT_URL: https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64
          SHFMT_SHA256: d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu runners restrict unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p ~/oracles
          curl -sSfL "$SHFMT_URL" -o ~/oracles/shfmt
          echo "$SHFMT_SHA256  $HOME/oracles/shfmt" | sha256sum -c -
          chmod +x ~/oracles/shfmt
      - name: Install
        run: python -m pip install --quiet -e '.[dev]'
      - name: Run the differential test
        env:
          BASHWALKER_DIFFERENTIAL: "1"
        run: |
          export PATH="$HOME/bash-${{ matrix.bash }}/bin:$HOME/oracles:$PATH"
          bash -c 'echo "bash $BASH_VERSION"'
          shfmt --version
          python -m pytest tests/test_differential.py
