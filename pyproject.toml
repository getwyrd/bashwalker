[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bashwalker"
version = "0.1.0"
description = "A bash command line in, proven facts per simple command out: a fail-closed tree-sitter-bash walker"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Eduard Ralph", email = "eduard@ralphovi.net" }]
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly: every fact the walker proves depends on how this grammar reads
    # bash. A consumer pins bashwalker exactly for the same reason.
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Tests import from src/ directly, never from an installed copy, so a test always runs
# against the tree it sits in.
pythonpath = ["src"]
testpaths = ["tests"]
